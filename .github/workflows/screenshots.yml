# Renders the app's screens on the JVM (Robolectric + Roborazzi) and uploads the PNGs.
name: Screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung test must not block the runner for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains   # matches gradle/gradle-daemon-jvm.properties
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Record screenshots
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain recordRoborazziDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glow-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
