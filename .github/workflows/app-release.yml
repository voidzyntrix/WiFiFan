# Builds the signed app and publishes it as wififan-app-<version>.apk, which the
# in-app updater picks up. Runs when a tag like app-v1.2.0 is pushed.
# Setup (signing secrets): docs/APP_UPDATES.md
name: App release

on:
  push:
    tags: ['app-v*']

permissions:
  contents: write   # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains   # matches gradle/gradle-daemon-jvm.properties
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Tag builds aren't on the default branch, so by default they'd never save the
          # Gradle cache and every release would start cold. Let them write it.
          cache-read-only: false

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "app-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion \"$version\" in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WIFIFAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret WIFIFAN_KEYSTORE_BASE64 is not set (see docs/APP_UPDATES.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WIFIFAN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          WIFIFAN_KEYSTORE_PASSWORD: ${{ secrets.WIFIFAN_KEYSTORE_PASSWORD }}
          WIFIFAN_KEY_ALIAS: ${{ secrets.WIFIFAN_KEY_ALIAS }}
          WIFIFAN_KEY_PASSWORD: ${{ secrets.WIFIFAN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was built; check the signing secrets"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/wififan-app-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="dist/wififan-app-$VERSION.apk"
          # The release may already exist if it was drafted in the GitHub UI with this tag.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "App v$VERSION" --generate-notes
          fi
