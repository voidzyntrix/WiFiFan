<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">
  <!-- A closed hand for the slider drag cursor. Chromium's own grabbing hand has a soft,
       see-through fill on Windows; this one is drawn fully solid (every pixel 100% opaque). -->
  <g stroke="#1d1d1d" stroke-width="1.2" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="7.3" cy="9.0" r="2.1"/>
    <circle cx="10.9" cy="8.6" r="2.2"/>
    <circle cx="14.5" cy="8.8" r="2.1"/>
    <circle cx="17.6" cy="9.8" r="2.0"/>
    <rect x="4.8" y="9.2" width="15.0" height="11.8" rx="4.6"/>
    <rect x="2.4" y="12.6" width="10.0" height="5.2" rx="2.6"/>
  </g>
  <g fill="#ffffff" stroke="none">
    <circle cx="7.3" cy="9.0" r="2.1"/>
    <circle cx="10.9" cy="8.6" r="2.2"/>
    <circle cx="14.5" cy="8.8" r="2.1"/>
    <circle cx="17.6" cy="9.8" r="2.0"/>
    <rect x="4.8" y="9.2" width="15.0" height="11.8" rx="4.6"/>
    <rect x="2.4" y="12.6" width="10.0" height="5.2" rx="2.6"/>
  </g>
  <!-- finger grooves and the thumb crease: the negative space that makes it read as a fist -->
  <g fill="none" stroke="#1d1d1d" stroke-width="1.2" stroke-linecap="round">
    <path d="M9.2 10.4 L9.0 13.2"/>
    <path d="M12.9 10.6 L12.8 13.4"/>
    <path d="M16.5 11.0 L16.5 13.4"/>
    <rect x="2.4" y="12.6" width="10.0" height="5.2" rx="2.6"/>
  </g>
</svg>
